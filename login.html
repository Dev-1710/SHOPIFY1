<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPIFY - Login</title><link rel="stylesheet" href="style.css"></head>
<body data-page="auth"><div class="box"><h2>Welcome to SHOPIFY</h2>
<div class="tabs"><button id="tabL">Login</button><button id="tabS" class="ghost">Sign Up</button></div>
<form id="loginForm"><input id="lu" placeholder="Username" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form>
<form id="signupForm" style="display:none"><input id="su" placeholder="Username" required><input id="se" type="email" placeholder="Email" required>
<input id="sp" type="password" placeholder="Password" required><input id="sc" type="password" placeholder="Confirm password" required><button>Create Account</button></form>
<div id="msg" class="msg"></div></div><script src="main.js"></script></body></html>
